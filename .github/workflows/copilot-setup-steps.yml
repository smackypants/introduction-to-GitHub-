name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gradle step
        if: ${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties') != '' }}
        run: ./gradlew tasks --no-daemon
